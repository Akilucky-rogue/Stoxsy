[pytest]
# Scope the suite to the real test directory. backend/scripts/ holds ad-hoc dev
# scripts (some named test_*.py) that are NOT part of the suite and caused a
# hard collection error via a duplicate basename
# (scripts/test_research_endpoints.py vs scripts/_archive/test_research_endpoints.py).
# importlib import-mode also makes pytest robust to duplicate basenames in general.
testpaths = tests
addopts = --import-mode=importlib
